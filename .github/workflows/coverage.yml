name: Code Coverage

on:
  push:
    branches: ["19.0", "19.0-*"]
  pull_request:
    branches: ["19.0"]

permissions:
  contents: read
  code-quality: write

jobs:
  coverage:
    name: Python Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libldap2-dev libsasl2-dev libssl-dev

      - name: Clone Odoo 19
        run: |
          git clone --depth=1 --branch=19.0 \
            https://github.com/odoo/odoo.git /opt/odoo || { \
            echo "ERROR: Failed to clone Odoo repository"; \
            exit 1; \
          }

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-odoo19-${{ hashFiles('/opt/odoo/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-odoo19-

      - name: Install Odoo and test dependencies
        run: |
          pip install -r /opt/odoo/requirements.txt
          pip install -e /opt/odoo
          pip install coverage

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail

          # Discover addon directories that actually belong to this repo
          mapfile -t modules < <(
            find . -mindepth 1 -maxdepth 1 -type d \
              -exec test -f "{}/__manifest__.py" ';' -print \
              | sed 's|^\./||' \
              | sort -u
          )

          if [[ ${#modules[@]} -eq 0 ]]; then
            echo "ERROR: No addon modules found in repository root."
            exit 1
          fi

          echo "Discovered repository addons:"
          printf '  %s\n' "${modules[@]}"
          echo ""

          # Symlink only repository addons into Odoo addons
          for module in "${modules[@]}"; do
            TARGET="/opt/odoo/odoo/addons/$module"

            if [[ -L "$TARGET" ]]; then
              rm -f "$TARGET"
            elif [[ -d "$TARGET" ]]; then
              echo "ERROR: Module $module conflicts with Odoo builtin — skipping symlink"
              continue
            fi

            ln -sfn "$GITHUB_WORKSPACE/$module" "$TARGET"
            echo "Symlinked: $module"
          done

          # Discover tests only inside repository addons
          test_files=()
          for module in "${modules[@]}"; do
            if [[ -d "$module/tests" ]]; then
              while IFS= read -r file; do
                test_files+=("$file")
              done < <(
                find "$module/tests" -type f -name "test_*.py" \
                  | sed 's|^\./||'
              )
            fi
          done

          if [[ ${#test_files[@]} -eq 0 ]]; then
            echo "ERROR: No test files found in repository addons."
            exit 1
          fi

          mapfile -t test_files < <(
            printf '%s\n' "${test_files[@]}" | sort -u
          )

          echo "Discovered test files:"
          printf '  %s\n' "${test_files[@]}"
          echo ""

          mapfile -t test_modules < <(
            printf '%s\n' "${test_files[@]}" \
              | sed 's|\.py$||; s|/|.|g' \
              | sed 's|^|odoo.addons.|'
          )

          echo "Running ${#test_modules[@]} test module(s):"
          printf '  %s\n' "${test_modules[@]}"
          echo ""

          COVERAGE_SOURCES=$(IFS=,; echo "${modules[*]}")
          echo "Coverage scope: $COVERAGE_SOURCES"
          echo ""

          python -m coverage run \
            --source="$COVERAGE_SOURCES" \
            -m unittest \
            "${test_modules[@]}"

          python -m coverage xml -o coverage.xml

      - name: Upload coverage report
        if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/19.0')
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: python
          label: Python
