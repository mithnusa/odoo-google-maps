name: Code Coverage

on:
  push:
    branches: ["19.0", "19.0-*"]
  pull_request:
    branches: ["19.0"]

permissions:
  contents: read
  code-quality: write

jobs:
  coverage:
    name: Python Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libldap2-dev libsasl2-dev libssl-dev

      - name: Clone Odoo 19
        run: |
          git clone --depth=1 --branch=19.0 \
            https://github.com/odoo/odoo.git /opt/odoo || { \
            echo "ERROR: Failed to clone Odoo repository"; \
            exit 1; \
          }

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-odoo19-${{ hashFiles('/opt/odoo/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-odoo19-

      - name: Install Odoo and test dependencies
        run: |
          pip install -r /opt/odoo/requirements.txt
          pip install -e /opt/odoo
          pip install coverage

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail

          # Discover all modules in this repo (must have __manifest__.py)
          mapfile -t modules < <(
            find . -mindepth 2 -maxdepth 2 -name "__manifest__.py" -print0 \
              | xargs -0 -n1 dirname \
              | sed 's|^\./||' \
              | sort -u
          )

          # Symlink only repo modules into Odoo addons
          for module in "${modules[@]}"; do
            TARGET="/opt/odoo/odoo/addons/$module"
            # Validate no collision with Odoo builtin modules
            if [[ -L "$TARGET" ]]; then
              echo "WARNING: Module $module already symlinked"
              rm -f "$TARGET"
            elif [[ -d "$TARGET" ]]; then
              echo "ERROR: Module $module conflicts with Odoo builtin — skipping symlink"
              continue
            fi
            ln -sfn "$GITHUB_WORKSPACE/$module" "$TARGET"
            echo "Symlinked: $module"
          done

          # Discover test_*.py files scoped to repo modules only
          mapfile -t test_modules < <(
            for module in "${modules[@]}"; do
              find "$module/tests" -maxdepth 2 -name "test_*.py" 2>/dev/null \
                | sed 's|\.py$||; s|/|.|g' \
                | sed 's/^/odoo.addons./'
            done | sort -u
          )

          if [[ ${#test_modules[@]} -eq 0 ]]; then
            echo "No test files found — skipping coverage run."
            exit 0
          fi

          echo "Running ${#test_modules[@]} test module(s):"
          printf '  %s\n' "${test_modules[@]}"
          echo ""

          # Build comma-separated list of coverage source directories
          COVERAGE_SOURCES=$(IFS=,; echo "${modules[*]}")
          echo "Coverage scope: $COVERAGE_SOURCES"
          echo ""

          python -m coverage run \
            --source="$COVERAGE_SOURCES" \
            -m unittest \
            "${test_modules[@]}"

          python -m coverage xml -o coverage.xml

      - name: Upload coverage report
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/19.0'
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: python
          label: Python
