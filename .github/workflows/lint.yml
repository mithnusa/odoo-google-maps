name: Lint (pylint-odoo)

on:
  push:
    branches: ["19.0", "19.0-*"]
  pull_request:
    branches: ["19.0"]

jobs:
  pylint:
    name: Run pylint-odoo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pylint "pylint-odoo>=9.0" "astroid>=3.0"

      - name: Run pylint-odoo
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' modules < <(
            find . -mindepth 2 -maxdepth 2 -name "__manifest__.py" -print0 \
              | xargs -0 -n1 dirname \
              | sort -zu
          )

          if [[ ${#modules[@]} -eq 0 ]]; then
            echo "No Odoo modules found (no __manifest__.py discovered)."
            exit 1
          fi

          pylint \
            --load-plugins=pylint_odoo \
            --disable=all \
            --enable=odoolint \
            --disable=manifest-required-author,manifest-deprecated-key,manifest-version-format,attribute-string-redundant,translation-positional-used,missing-readme \
            "${modules[@]}"
