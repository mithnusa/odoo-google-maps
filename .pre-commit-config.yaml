exclude: "static/(lib|img)/|tests"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-ast
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master", "--branch", "19.0"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        args: ["--line-length=79", "--skip-string-normalization"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6   # bump to latest
    hooks:
      - id: ruff
        args: ["--fix", "--ignore=F401"]
        # F401 per-file-ignores configured in pyproject.toml

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier (javascript)
        types: [javascript]
        additional_dependencies:
          - prettier@3.1.0
        args: ["--print-width=120"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier (xml)
        types: [xml]
        additional_dependencies:
          - prettier@2.7.1
          - "@prettier/plugin-xml@2.2.0"
        args: ["--print-width=120"]

  - repo: https://github.com/OCA/pylint-odoo
    rev: v10.0.11   # check for latest
    hooks:
      - id: pylint_odoo
        args:
          - --disable=all
          - --enable=odoolint
          - --disable=manifest-required-author,manifest-deprecated-key,attribute-string-redundant,translation-positional-used,missing-readme,no-search-all
          - --load-plugins=pylint_odoo
        verbose: true

  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.2.26
    hooks:
      - id: oca-checks-odoo-module
        args:
          - --disable=prefer-readme-rst,xml-tag-position,xml-field-numeric-without-eval
      - id: oca-checks-po

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.10.0
    hooks:
      - id: eslint
        files: \.js$
        exclude: "static/lib"
        additional_dependencies:
          - eslint@9.39.1
          - "@babel/eslint-parser@7.29.7"
          - "@babel/core@7.29.7"
